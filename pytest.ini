[pytest]
# ============================================================================
# Configuração de testes do DATASUS LLM (FASE P4)
# ============================================================================
# Objetivo: garantir que `python -m pytest test/` rode de forma determinística,
# sem "INTERNALERROR" nem travamentos causados por arquivos que são, na
# verdade, scripts manuais (executam código pesado no import: ingestão DuckDB,
# chamadas ao LLM/Ollama, `sys.exit()`, etc.).
#
# Convenções:
#   - Arquivos *reais* de teste: nomes `test_*.py` que definem funções/classe
#     `TestCase` de teste e NÃO executam lógica no nível de módulo.
#   - Scripts manuais: arquivos `test_*.py` que executam código no import.
#     Eles são listados em `test/conftest.py::collect_ignore` e continuam
#     executáveis manualmente via `python test/<arquivo>.py`.
# ============================================================================

testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores registrados (evita warnings "Unknown pytest.mark"):
markers =
    slow: testes que tocam dados reais ou o LLM (podem ser lentos; usar -m "not slow")
    integration: testes de integração ponta-a-ponta
    requires_data: exigem o cache/dados reais do DATASUS (SKIP gracioso se ausente)
    requires_llm: exigem um backend LLM (Ollama) acessível (SKIP gracioso se ausente)

# Semântica estrita de marcadores: um marcador não registrado vira erro.
addopts = --strict-markers -p no:cacheprovider

# Não procurar testes dentro de diretórios de build/cache/venv:
norecursedirs = .git .venv venv __pycache__ build dist *.egg-info .pytest_cache
